databaseChangeLog:
  - changeSet:
      id: 004-create-book-activity
      author: anne
      changes:
        - createTable:
            tableName: book_activity
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: event_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: event_type, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: book_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: title, type: VARCHAR(255) }
              - column: { name: username, type: VARCHAR(255) }
              - column: { name: occurred_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: processed_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: book_activity
            columnNames: event_id
            constraintName: uq_book_activity_event_id