spring:
  application:
    name: book-tracker

  datasource:
    url: jdbc:h2:mem:booktracker
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: book-tracker-ui
            client-secret: vvlyDPsVQbkxVM3InB8V5oEurGNFbMCy3dTdhBnTWZ9eQGEoRq1rTKs9BON2yC5bR8j7zxXmOLwaLq8fvh4yAT
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/book-tracker
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/book-tracker