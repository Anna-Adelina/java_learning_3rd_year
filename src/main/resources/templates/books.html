<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Tracker</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        form.inline { display: inline; }
    </style>
</head>
<body>
<h1>📚 Book Tracker</h1>

<table>
    <thead>
    <tr><th>Title</th><th>Author</th><th>Status</th><th>Added by</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}"></td>
        <td th:text="${book.authorId}"></td>
        <td th:text="${book.readingStatus}"></td>
        <td th:text="${book.createdBy}"></td>
        <td>
            <form class="inline" th:action="@{/books/{id}/delete(id=${book.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<h2>Add book</h2>
<form th:action="@{/books}" method="post">
    <input type="text" name="title" placeholder="Title" required />
    <select name="authorId">
        <option th:each="author : ${authors}"
                th:value="${author.id}"
                th:text="${author.firstName + ' ' + author.lastName}">
        </option>
    </select>
    <select name="readingStatus">
        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
    </select>
    <button type="submit">Add</button>
</form>
</body>
</html>
